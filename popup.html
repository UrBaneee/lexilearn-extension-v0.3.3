<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiLearn</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="popup">
  <h1>LexiLearn</h1>
  <p class="muted">Save the words you meet while reading.</p>
  <label for="lang">Explain or translate into</label>
  <select id="lang">
    <option value="zh">Chinese (简体)</option>
    <option value="zh-Hant">Chinese (繁體)</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
  </select>
  <button id="toggle" class="primary" type="button" disabled>Enable GRE highlights</button>
  <button id="openSide" type="button">Open vocabulary</button>
  <p class="muted">Select a word on a webpage, right-click, and choose <b>Look up in LexiLearn</b>.</p>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
